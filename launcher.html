<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayfire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --ink:#fff; --soft:#b8b8b8; --shadow:#3f3f3f; --gold:#ffff55;
  --btn:#6f6f6f; --btn-hover:#7b86bd; --btn-on:#b5481a;--fire:#ff8a2b;--sw:288px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:#1b1209;color:var(--ink);font:11px/1.7 'Press Start 2P',ui-monospace,monospace;-webkit-font-smoothing:none}
.app{display:flex;height:100%}

.side{
  width:288px;flex:none;display:flex;flex-direction:column;gap:14px;padding:16px;
  background:radial-gradient(ellipse at 50% 108%,rgba(255,120,30,.38),transparent 55%),linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),var(--stone-img,none),#4a4a4a;
  background-size:auto,auto,128px 128px,auto;image-rendering:pixelated;
  border-right:4px solid #000;
  box-shadow:inset -4px 0 0 rgba(255,255,255,.08);
}
.brand{padding:6px 4px 10px;border-bottom:4px solid rgba(0,0,0,.55)}
.brand b{display:block;font-size:14px;font-weight:400;color:var(--gold);text-shadow:2px 2px 0 #3f3f15}
.brand span{display:block;margin-top:6px;font-size:8px;color:var(--soft);text-shadow:1px 1px 0 #000}
.nav{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}

.tab{
  display:flex;align-items:center;gap:14px;width:100%;padding:12px 12px;
  font:inherit;color:#e6e6e6;text-align:left;cursor:pointer;
  background:var(--btn);border:2px solid #000;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.35),inset -3px -3px 0 rgba(0,0,0,.45);
  text-shadow:2px 2px 0 var(--shadow);
}
.tab:hover{background:var(--btn-hover);color:var(--gold)}
.tab:active{padding-top:14px;padding-bottom:10px;box-shadow:inset 3px 3px 0 rgba(0,0,0,.45),inset -3px -3px 0 rgba(255,255,255,.2)}
.tab[aria-current="page"]{background:var(--btn-on);color:#fff;box-shadow:inset 3px 3px 0 rgba(0,0,0,.45),inset -3px -3px 0 rgba(255,255,255,.25)}
.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ico{width:24px;height:24px;flex:none;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.55))}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.foot small{font-size:8px;color:var(--soft);text-shadow:1px 1px 0 #000;padding-left:4px}
#snd[aria-pressed="false"] .ico{opacity:.4}

.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:28px;background:#000;overflow:auto}
h1{margin:0 0 22px;font-size:20px;font-weight:400;text-shadow:3px 3px 0 var(--shadow)}
.panel{
  flex:1;padding:26px;background:#0d0d0d;border:2px solid #2e2e2e;border-radius:16px;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.12),inset -3px -3px 0 rgba(0,0,0,.4);
}
.panel p{margin:0 0 12px;max-width:60ch;text-shadow:2px 2px 0 #000}
.panel .hint{color:var(--soft);font-size:9px}


.panel.bare{background:none;border:0;padding:0;box-shadow:none;display:flex;flex-direction:column}
[hidden]{display:none!important}
.hero{position:relative;min-height:clamp(220px,40vh,400px);border-radius:22px;overflow:hidden;
  background-size:cover;background-position:center;image-rendering:pixelated;border:1px solid rgba(255,255,255,.14)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.6),transparent 45%,rgba(0,0,0,.4))}
.hero-title{position:absolute;top:18px;left:22px;right:22px;font-size:12px;text-shadow:2px 2px 0 #000;line-height:1.8}
.hero-title b{display:block;margin-top:4px;font-size:18px;font-weight:400;color:var(--gold)}
.tab.go{position:absolute;right:18px;bottom:18px;width:auto;padding:14px 36px;background:#3f9a2a;color:#fff}
.tab.go:hover{background:#55b83c;color:var(--gold)}
h2{margin:28px 0 14px;font-size:13px;font-weight:400;text-shadow:2px 2px 0 var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding-bottom:8px}
.card{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;padding:0;cursor:pointer;
  font:inherit;color:#fff;text-align:left;background-size:cover;background-position:center;image-rendering:pixelated;
  border:2px solid rgba(255,255,255,.12)}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.65),transparent 55%)}
.card span{position:absolute;top:10px;left:12px;right:12px;font-size:9px;line-height:1.6;text-shadow:2px 2px 0 #000}
.card:hover{border-color:rgba(255,160,70,.8)}
.card[aria-pressed="true"]{border-color:#ff8a2b;box-shadow:0 0 0 2px #ff8a2b,0 0 20px rgba(255,138,43,.5)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.bar h2,dialog h2{margin:0}
dialog h2{margin-bottom:16px}
.tab.sm{width:auto;padding:10px 16px;font-size:10px}
.tab.ok{background:#3f9a2a;color:#fff}.tab.ok:hover{background:#55b83c;color:var(--gold)}
.tab.red{background:#9a3a30}.tab.red:hover{background:#b8483c;color:var(--gold)}
.sheet{position:sticky;bottom:0;margin:auto 0 0;padding:16px 18px;background:#111;border:1px solid rgba(255,255,255,.16);
  border-radius:20px 20px 0 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sheet .nm{flex:1;min-width:140px;text-shadow:2px 2px 0 #000}
.sheet.anim{animation:up .18s ease-out}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet.anim{animation:none}}
.sec{background:#0d0d0d;border:1px solid #2e2e2e;border-radius:16px;padding:18px;margin-bottom:16px}
.sec h3{margin:0 0 14px;font-size:12px;font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;font-size:9px;color:var(--soft)}
input[type=text],select,textarea{font:inherit;font-size:11px;color:#fff;background:#000;border:2px solid #8b8b8b;border-radius:0;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:90px}
input[type=text]:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.thumb{width:96px;aspect-ratio:16/10;border-radius:10px;background-size:cover;background-position:center;image-rendering:pixelated;border:2px solid rgba(255,255,255,.22);padding:0;cursor:pointer}
button.thumb:hover{border-color:#fff}
.mod{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #2e2e2e;border-radius:12px;margin-top:8px;font-size:10px;flex-wrap:wrap}
.mod .n{flex:1;min-width:120px;overflow-wrap:anywhere}
.mod.off .n{opacity:.45;text-decoration:line-through}
dialog{background:#0d0d0d;color:#fff;border:2px solid #444;border-radius:18px;padding:22px;width:min(520px,92vw);font:inherit}
dialog::backdrop{background:rgba(0,0,0,.75)}
.err{color:#ff7b7b;font-size:9px;min-height:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;border:2px solid #666;padding:10px 16px;font-size:10px;border-radius:10px;z-index:9;max-width:90vw;text-align:center}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill[aria-pressed="true"]{background:var(--btn-on);color:#fff;box-shadow:inset 3px 3px 0 rgba(0,0,0,.45),inset -3px -3px 0 rgba(255,255,255,.25)}
#q{margin-bottom:10px}
.cat{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start;margin-bottom:16px}
.filt{background:#0d0d0d;border:1px solid #2e2e2e;border-radius:14px;padding:14px}
.fh{margin:14px 0 6px;font-size:9px;color:var(--soft)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;margin-top:4px;background:none;border:0;border-radius:8px;color:#d6d6d6;font:inherit;font-size:10px;text-align:left;cursor:pointer}
label.opt{justify-content:flex-start}
.opt:hover{background:#1d1e22}
.opt[aria-pressed="true"]{background:#2a1d14;color:#ffb15c}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;cursor:pointer;font:inherit;color:#fff;background:#15161a;border:1px solid #2a2b30;border-radius:14px}
.mcard:hover{border-color:#ff8a2b;box-shadow:0 0 16px rgba(255,138,43,.3)}
.mcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mcard .im{aspect-ratio:16/8;background-size:cover;background-position:center;image-rendering:pixelated}
.mcard .bd{padding:12px;display:flex;flex-direction:column;gap:8px}
.mcard h4{margin:0;font-size:11px;font-weight:400}
.mcard p{margin:0;font-size:9px;line-height:1.7;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:none}
.badge{font-size:8px;padding:3px 6px;border-radius:6px;background:#26272d;color:#d0d0d0;white-space:nowrap}
.fr{display:flex;flex-direction:column;gap:18px}
.scene{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#070b1f}
.scene canvas{display:block;width:100%;height:auto;aspect-ratio:20/9;image-rendering:pixelated}
.s-title{text-shadow:2px 2px 0 #000}
.s-title b{display:block;font-size:20px;font-weight:400;color:var(--gold)}
.s-title span{display:block;margin-top:8px;font-size:9px;line-height:1.8;color:#d0d6ff;max-width:46ch}
.tag{position:absolute;top:83%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.68);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.18);font-size:9px;white-space:nowrap;text-shadow:2px 2px 0 #000}
.tag .ico{width:18px;height:18px}
.tag .dim{color:var(--soft)}
.pill2{align-self:center;max-width:100%;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.2);font-size:9px;line-height:1.6;text-align:center;text-shadow:1px 1px 0 #000}
.pill2.on{border-color:#ff8a2b;color:#ffd08a}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.fcard{background:#0d0d0d;border:1px solid #2e2e2e;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.fcard h3{margin:0;font-size:13px;font-weight:400;text-shadow:2px 2px 0 var(--shadow)}
.fcard p{margin:0}
.tab.big{width:auto;padding:14px 24px;font-size:11px}
.frow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;background:none;border:0;border-radius:10px;color:#fff;font:inherit;font-size:10px;cursor:pointer;text-align:left}
.frow:hover{background:#1d1e22}
.frow:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.frow .fn{flex:1;min-width:0;overflow-wrap:anywhere}
.frow .ico{width:24px;height:24px}
.frow .st{font-size:8px;color:var(--soft);display:flex;align-items:center;gap:6px}
.frow .st::before{content:'';width:8px;height:8px;background:#555}
.frow .st.on{color:#8be06a}.frow .st.on::before{background:#5dbb32}
.bub{position:absolute;top:17%;transform:translate(-50%,-100%);padding:6px 10px;background:#fff;color:#111;border:2px solid #000;font-size:9px;white-space:nowrap;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.bub::after{content:'';position:absolute;left:50%;bottom:-7px;width:8px;height:8px;background:#fff;border:2px solid #000;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.st{display:flex;flex-direction:column;gap:18px}
.sx-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:stretch}
.stage{padding:0;overflow:hidden;position:relative}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:48/44;image-rendering:pixelated}
.stage .sb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.acc{display:flex;align-items:center;gap:14px}
.acc .face{width:48px;height:48px;image-rendering:pixelated;border:2px solid #000;box-shadow:0 0 0 2px #3a3a3a;flex:none}
.acc b{display:block;font-size:13px;font-weight:400;text-shadow:2px 2px 0 var(--shadow)}
.tab.ms .ico{width:18px;height:18px;filter:none}
.swr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.swl{width:84px;font-size:9px;color:var(--soft)}
.swb{width:26px;height:26px;padding:0;cursor:pointer;border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.4)}
.swb[aria-pressed="true"]{outline:3px solid #fff;outline-offset:1px}
.swb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px}
.tg{width:58px;height:26px;position:relative;flex:none;padding:0;cursor:pointer;background:#3a3a3a;border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(0,0,0,.5)}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#b8b8b8;box-shadow:inset 2px 2px 0 rgba(255,255,255,.5),inset -2px -2px 0 rgba(0,0,0,.35);transition:left .12s}
.tg[aria-checked="true"]{background:#3f9a2a}
.tg[aria-checked="true"]::after{left:34px}
.tg:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tg::after{transition:none}}
.sl{display:flex;align-items:center;gap:12px}
.sl input{flex:1;min-width:0;accent-color:#5dbb32}
.sv{width:64px;text-align:right;font-size:10px;color:#fff}
#embers{position:fixed;top:0;bottom:0;right:0;left:var(--sw);width:calc(100% - var(--sw));height:100%;pointer-events:none;z-index:0;image-rendering:pixelated}
.main{position:relative}
.main>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:16px}
.logo{width:44px;height:44px;flex:none}
.fire-i{filter:drop-shadow(0 0 12px rgba(255,130,30,.6));animation:fl 1.6s steps(6) infinite}
@keyframes fl{0%,100%{filter:drop-shadow(0 0 10px rgba(255,130,30,.5)) brightness(1)}40%{filter:drop-shadow(0 0 20px rgba(255,150,40,.85)) brightness(1.12)}70%{filter:drop-shadow(0 0 13px rgba(255,120,30,.6)) brightness(.96)}}
body.calm .fire-i{animation:none}
@media (prefers-reduced-motion:reduce){.fire-i{animation:none}}
.hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid rgba(255,140,40,.3)}
.hd-i{width:64px;height:64px;flex:none}
.hd-t{flex:1;min-width:200px}
.hd-t b{display:block;font-size:22px;font-weight:400;color:var(--gold);text-shadow:3px 3px 0 #6b1d00,0 0 18px rgba(255,140,40,.5)}
.hd-t span{display:block;margin-top:8px;font-size:9px;line-height:1.8;color:#d9c7b0}
.hd-a{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec h3::before,.fcard h3::before{content:'';display:inline-block;width:10px;height:10px;margin-right:10px;background:#ff8a2b;box-shadow:inset -3px -3px 0 #d7381f,inset 2px 2px 0 #ffe066}
.fcard,.sec,.filt{background:linear-gradient(180deg,rgba(255,120,30,.07),transparent 45%),#0d0d0d;box-shadow:inset 0 1px 0 rgba(255,150,50,.3)}
dialog{border-color:#6b3a1a}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 8% 100%,rgba(255,120,30,.42),transparent 55%);pointer-events:none}
.hero-title,.tab.go{z-index:1}
.hero-fire{position:absolute;left:18px;bottom:12px;width:84px;height:84px;z-index:1;pointer-events:none}
.tab.go{background:#d9531a}.tab.go:hover{background:#ff7a1f;color:var(--gold)}
.stage-fire{position:absolute;top:12px;right:12px;width:64px;height:64px;pointer-events:none}
.side{overflow-y:auto}
.tab.acct{padding:8px 10px;gap:10px}
.acct .face{width:30px;height:30px;image-rendering:pixelated;border:2px solid #000;flex:none}
.acct .lbl{display:flex;flex-direction:column;gap:4px;min-width:0}
.acct b{font-weight:400;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct small{font-size:7px;padding:0;color:#d0c4b8}
.acct.lic small{color:#8be06a}
.code{font-size:22px;letter-spacing:4px;color:var(--gold);text-align:center;padding:14px;margin:12px 0;border:2px dashed #6b3a1a;background:#120a05;text-shadow:2px 2px 0 #3a1500}
.stp{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:10px;color:var(--soft)}
.mk{width:12px;height:12px;background:#444;flex:none}
.mk[data-s="active"]{background:#ff8a2b}
.mk[data-s="done"]{background:#5dbb32}
.mk[data-s="error"]{background:#d7381f}
.tour{position:fixed;inset:0;z-index:50}
.tour.solid{background:rgba(0,0,0,.78)}
.tour-hole{position:absolute;border:2px solid #ff8a2b;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.76),0 0 26px rgba(255,138,43,.65);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}
@media (prefers-reduced-motion:reduce){.tour-hole{transition:none}}
.tour-tip{position:absolute;width:min(350px,calc(100vw - 24px));background:#120a05;border:2px solid #ff8a2b;border-radius:14px;padding:16px;box-shadow:0 0 0 3px #000,0 12px 40px rgba(0,0,0,.7)}
.tour-tip b{display:block;font-size:13px;font-weight:400;color:var(--gold);text-shadow:2px 2px 0 #6b1d00;margin-bottom:10px}
.tour-tip p{margin:0 0 14px;font-size:10px;line-height:1.9;color:#eadbc8}
.tt-n{font-size:8px;color:var(--soft);margin-bottom:8px}
.tt-fire{display:block;width:64px;height:64px;margin:0 auto 10px}
.mi{width:28px;height:28px;border-radius:6px;flex:none;background:#222;object-fit:cover}
.pbar{height:16px;background:#000;border:2px solid #8b8b8b;margin:14px 0}
.pfill{height:100%;width:0;background:#5dbb32;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
@media (max-width:760px){
  :root{--sw:76px}.brand div{display:none}.brand{justify-content:center;padding:6px 0 10px}.hd-i{width:44px;height:44px}.hd-t b{font-size:15px}.hero-fire{width:56px;height:56px}
  .sx-hero{grid-template-columns:1fr}
  .s-title b{font-size:14px}.tag{font-size:7px;padding:4px 6px}.tag .ico{width:12px;height:12px}.pill2{font-size:7px}
  .cat{grid-template-columns:1fr}
  .side{width:76px;padding:10px}
  .foot small,.lbl{display:none}
  .tab{justify-content:center;padding:12px 0}
  .main{padding:16px}
  h1{font-size:14px}
}

/* Хэллоуин (отключается в настройках) */
body.hw{--btn-on:#7a2fbf;--btn-hover:#a5561f;--fire:#ff7a1a;--gold:#ffb347;background-color:#0b0612}
body.hw::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 55% at 50% 0%,rgba(150,70,255,.22),transparent 70%),radial-gradient(60% 40% at 50% 105%,rgba(255,120,20,.2),transparent 70%)}
#hwl{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden;display:none}
body.hw #hwl{display:block}
#hwl i{position:absolute;font-style:normal;top:-60px;filter:drop-shadow(0 0 10px rgba(255,140,40,.6));animation:hwf linear infinite}
@keyframes hwf{0%{transform:translate(0,-60px) rotate(0)}50%{transform:translate(var(--dx),55vh) rotate(18deg)}100%{transform:translate(0,112vh) rotate(-12deg)}}
#hwl b{position:absolute;right:0;top:0;font-size:96px;line-height:1;opacity:.55;transform:scaleX(-1);font-weight:400;filter:drop-shadow(0 0 8px #000)}
body.hw .brand b::after{content:" 🎃"}
body.calm #hwl i{animation:none;display:none}
@media(prefers-reduced-motion:reduce){#hwl i{animation:none;display:none}}

/* Оформление 1.0.1: карточки, плавность, Хэллоуин */
.fcard{background:linear-gradient(180deg,#141018,#0b0a0d);border-color:#3a2f2a;box-shadow:0 10px 30px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .25s,border-color .25s,box-shadow .25s}
.fcard:hover{transform:translateY(-3px);border-color:#6b4a2f}
.panel>*{animation:wfUp .4s ease both}
@keyframes wfUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tab{transition:background .15s,transform .15s,box-shadow .15s,color .15s}.tab:hover{transform:translateY(-1px)}
.main::-webkit-scrollbar,.side::-webkit-scrollbar{width:10px}.main::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{background:#3b3b3b;border-radius:6px}.main::-webkit-scrollbar-track,.side::-webkit-scrollbar-track{background:transparent}
body.hw .fcard{background:linear-gradient(180deg,#1a1024,#0c0712);border-color:#4b2a6b;box-shadow:0 10px 30px -14px #000,0 0 22px -8px rgba(150,70,255,.45),inset 0 1px 0 rgba(255,255,255,.06)}
body.hw .fcard:hover{border-color:#ff8a2b;box-shadow:0 14px 34px -12px #000,0 0 28px -6px rgba(255,138,43,.65)}
body.hw .side{box-shadow:inset 0 0 0 9999px rgba(70,20,110,.3),4px 0 30px -8px rgba(150,70,255,.4)}
body.hw .tab:hover{box-shadow:0 0 16px -2px rgba(255,138,43,.6)}
body.hw .main h1,body.hw .main h2{text-shadow:0 0 16px rgba(255,140,40,.55),0 0 34px rgba(150,70,255,.35)}
body.hw::after{content:"";position:fixed;left:0;right:0;bottom:0;height:24vh;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(150,90,220,.24),transparent);animation:wfFog 7s ease-in-out infinite alternate}
@keyframes wfFog{to{opacity:.4}}
body.calm.hw::after,body.calm .panel>*{animation:none}
@media(prefers-reduced-motion:reduce){.panel>*,body.hw::after{animation:none}}
</style>

function blip(f1,f2,d,type,v){
  if(!soundOn)return;

    ac=ac||new (window.AudioContext||window.webkitAudioContext)();

}

function cover(seed,pal){
  const W=96,H=54,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  let r=seed;const rnd=()=>(r=(r*1664525+1013904223)>>>0)/4294967296;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=pal[2];x.fillRect(66+((rnd()*14)|0),7,8,8);
  for(let l=0;l<3;l++){
    const base=26+l*8;let h=base;x.fillStyle=pal[3+l];
    for(let i=0;i<W;i+=3){h+=Math.round((rnd()-.5)*4);h=Math.max(base-5,Math.min(base+5,h));x.fillRect(i,h,3,H-h)}
  }
  return 'url('+c.toDataURL()+')';
}

async function detect(f){

  if(window.JSZip){
    try{
      const names=Object.keys((await JSZip.loadAsync(f)).files);
      if(names.some(x=>/(^|\/)shaders\//.test(x)))return 'shader';
      if(names.some(x=>/(^|\/)level\.dat$/.test(x)))return 'map';
      if(names.some(x=>/(^|\/)pack\.mcmeta$/.test(x)))return 'texture';

function frame(t){
  const x=F.ctx;if(!x)return;
  x.clearRect(0,0,160,72);x.drawImage(F.bg,0,0);
  [[34,.05],[26,.06],[18,.08],[11,.1]].forEach(([w,a])=>{
    const h=(w*.7)|0;x.fillStyle='rgba(255,150,40,'+a+')';x.fillRect(80-w,58-h,w*2,h+13);
  });
  if(FIRE.ok){const j=Math.round(Math.sin(t/130)*.5+.5);x.imageSmoothingEnabled=false;x.drawImage(FIRE.c,62,23-j,36,36+j)}
  F.em.forEach((e,i)=>{
    if(e.l<=0){e.x=77+Math.random()*6;e.y=40;e.l=14+Math.random()*16;e.v=.5+Math.random()*.6}
    e.y-=e.v;e.x+=Math.sin(t/300+i)*.35;e.l--;
    x.fillStyle=i%2?'#ffb347':'#ffe066';x.globalAlpha=Math.min(1,e.l/8);x.fillRect(e.x|0,e.y|0,1,1);x.globalAlpha=1;
  });
  drawActors(x,t);
}
function redraw(){if(!F.raf)frame(performance.now())}
function stopFire(){if(F.raf)cancelAnimationFrame(F.raf);F.raf=0;if(ST.raf)cancelAnimationFrame(ST.raf);ST.raf=0}
function startFire(){
  stopFire();F.ctx=F.cv.getContext('2d');F.ctx.imageSmoothingEnabled=false;
  if(!F.bg)F.bg=sceneBg();
  F.em=Array.from({length:12},()=>({x:80,y:48,l:0,v:.5}));
  frame(performance.now());
  if(!CFG.anim||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  let last=0;
  const loop=t=>{F.raf=requestAnimationFrame(loop);if(t-last<110)return;last=t;frame(t)};
  F.raf=requestAnimationFrame(loop);
}

  panel.replaceChildren(root);
  F.ui={paintJoin,paintScene,err:t=>{err.textContent=t},host:()=>paintHost()};

/* ---- коды для игры без сервера ---- */
async function packCode(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  let bytes=raw,tag='0';
  if(typeof CompressionStream!=='undefined'){
    bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());tag='1';
  }
  let s='';bytes.forEach(b=>{s+=String.fromCharCode(b)});
  return 'WF'+tag+'.'+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpackCode(code){
  const m=/^WF([01])\.([A-Za-z0-9_-]+)$/.exec(String(code).replace(/\s+/g,''));
  if(!m)throw new Error('Код выглядит неправильно. Скопируй его целиком, от WF до конца.');
  const b64=m[2].replace(/-/g,'+').replace(/_/g,'/'),bin=atob(b64+'='.repeat((4-b64.length%4)%4));
  let bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  if(m[1]==='1'){
    try{bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
    catch(e){throw new Error('Код повреждён. Скопируй его заново.')}
  }
  try{return JSON.parse(new TextDecoder().decode(bytes))}catch(e){throw new Error('Код повреждён. Скопируй его заново.')}
}

/* ---- игра с друзьями по сети: сервер комнат находит друга, дальше игра идёт напрямую (WebRTC) ---- */
const NETB=(window.wayfire&&window.wayfire.net)||null;
const friendList=()=>NETB?CFG.friends.map(n=>({n,on:false,room:''})):FRIENDS;
const NICKRE=/^[A-Za-z0-9_]{3,16}$/;
const P2P={es:null,key:'',nick:'',pcs:{},waits:{},lan:0,n:0,codePeer:'',
  ready(){return !!NETB&&!!CFG.signal},
  url(p){return CFG.signal.replace(/\/+$/,'')+p},
  ui(){if(F.ui){F.ui.paintJoin();F.ui.paintScene()}},
  async post(path,body){
    const r=await fetch(this.url(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:this.nick,key:this.key,...body})});
    if(!r.ok)throw new Error(r.status===404?'offline':'Сервер комнат ответил ошибкой '+r.status);
  },
  send(to,type,data){return this.post('/v1/send',{to,type,data})},
  close(){if(this.es){this.es.close();this.es=null}this.key=''},
  connect(){
    if(this.es&&this.key&&this.nick===F.me)return Promise.resolve();
    if(!NICKRE.test(F.me))return Promise.reject(new Error('Ник для сетевой игры: латиница, цифры и _ (3–16 символов).'));
    this.close();this.nick=F.me;
    return new Promise((res,rej)=>{
      const es=new EventSource(this.url('/v1/stream?nick='+encodeURIComponent(F.me)));this.es=es;
      es.addEventListener('hello',e=>{this.key=JSON.parse(e.data).key;res()});
      es.addEventListener('msg',e=>this.onMsg(JSON.parse(e.data)));
      es.onerror=()=>{
        const had=!!this.key;es.close();this.es=null;this.key='';
        if(!had)rej(new Error('Нет связи с сервером комнат или ник «'+F.me+'» уже занят.'));
        else{this.closePeers();F.host=false;F.state='idle';F.peer=null;this.ui();toast('Связь с сервером комнат потеряна')}
      };
    });
  },
  async setHost(on,idx){
    if(on){
      await this.connect();
      await NETB.hostStart();
      const b=BUILDS[idx]||BUILDS[0]||{};
      await this.post('/v1/host',{hosting:true,info:{build:b.name||'',version:b.version||''}});
    }else{
      if(this.key)await this.post('/v1/host',{hosting:false}).catch(()=>{});
      await NETB.hostStop();this.closePeers();this.lan=0;
    }
  },
  hostText(){
    if(!F.host)return 'Пока игра закрыта, друзья не смогут к тебе подключиться.';
    if(!this.ready())return 'Игра открыта. Друзья подключатся к тебе по нику «'+F.me+'».';
    return this.lan?'Мир найден (порт '+this.lan+'). Друзья подключаются по нику «'+F.me+'».':'Теперь запусти Minecraft, открой свой мир и нажми Esc, затем «Открыть для сети».';
  },
  onMsg(m){
    if(m.type==='request')return this.onRequest(m.from);
    if(m.type==='accept'||m.type==='deny'){const w=this.waits[m.from];if(w)w(m.type==='accept');return}
    const e=this.pcs[m.from];if(!e)return;
    if(m.type==='offer')return this.onOffer(m.from,m.data);
    if(m.type==='answer'){e.pc.setRemoteDescription(m.data).then(()=>this.flush(e)).catch(()=>{});return}
    if(m.type==='ice'&&m.data){if(e.pc.remoteDescription)e.pc.addIceCandidate(m.data).catch(()=>{});else(e.q=e.q||[]).push(m.data)}
  },
  flush(e){(e.q||[]).splice(0).forEach(c=>e.pc.addIceCandidate(c).catch(()=>{}))},
  onRequest(from){
    if(!F.host||!this.lan||this.pcs[from]){
      this.send(from,'deny',null).catch(()=>{});
      if(F.host&&!this.lan)toast('«'+from+'» хочет зайти. Сначала открой мир для сети в Minecraft');
      return;
    }
    modal('Запрос на вход',[$('p',null,'«'+from+'» хочет зайти в твою игру. Разрешить?')],
      [['Разрешить','ok',()=>{this.mkPc(from,'host');this.send(from,'accept',null).catch(()=>{})}],['Отклонить','',()=>this.send(from,'deny',null).catch(()=>{})]]);
  },
  mkPc(peer,role,offerer=(role==='join')){
    const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}),e={pc,dc:null,role,q:[],t:0};
    this.pcs[peer]=e;
    pc.onicecandidate=ev=>{if(ev.candidate)this.send(peer,'ice',ev.candidate.toJSON?ev.candidate.toJSON():ev.candidate).catch(()=>{})};
    pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState))this.drop(peer)};
    const bind=dc=>{
      e.dc=dc;dc.binaryType='arraybuffer';
      dc.onopen=()=>this.opened(peer,role);
      dc.onmessage=ev=>NETB.fromPeer(peer,ev.data);
      dc.onclose=()=>this.drop(peer);
    };
    if(offerer)bind(pc.createDataChannel('mc'));else pc.ondatachannel=ev=>bind(ev.channel);
    return e;
  },
  async onOffer(from,desc){
    const e=this.pcs[from];if(!e)return;
    try{
      await e.pc.setRemoteDescription(desc);this.flush(e);
      const a=await e.pc.createAnswer();await e.pc.setLocalDescription(a);
      await this.send(from,'answer',{type:a.type,sdp:a.sdp});
    }catch(err){this.drop(from)}
  },
  async opened(peer,role){
    const e=this.pcs[peer];if(e)clearTimeout(e.t);
    const who=(e&&e.label)||peer;
    try{
      const r=await NETB.peerOpen({peer,role,name:'Игра '+(role==='join'?who:F.me)});
      F.state='joined';F.peer=who;F.pop=performance.now();burst();sSwitch();
      if(role==='join'){
        this.port=r.port;
        if(!(e&&e.code)){CFG.friends=[...new Set([...CFG.friends,peer])];saveCfg()}
        toast('Открой Minecraft, раздел «Сетевая игра»: там появится мир «Игра '+who+'»');
      }else toast('«'+who+'» подключился к твоей игре');
      this.ui();
    }catch(err){this.fail(em(err),peer)}
  },
  async join(nick){
    await this.connect();
    let info;
    try{info=await (await fetch(this.url('/v1/lookup?nick='+encodeURIComponent(nick)))).json()}catch(e){throw new Error('Нет связи с сервером комнат.')}
    if(!info.online||!info.hosting)throw new Error('Игрок «'+nick+'» не в сети или не открыл игру');
    F.room=info.info&&info.info.build?info.info.build:'';
    const ok=await new Promise(res=>{this.waits[nick]=res;this.send(nick,'request',null).catch(()=>res(false));setTimeout(()=>res(false),60000)});
    delete this.waits[nick];
    if(!ok)throw new Error('«'+nick+'» не принял запрос');
    const e=this.mkPc(nick,'join');
    const off=await e.pc.createOffer();await e.pc.setLocalDescription(off);
    await this.send(nick,'offer',{type:off.type,sdp:off.sdp});
    e.t=setTimeout(()=>{if(F.state!=='joined')this.fail('Не удалось соединиться напрямую. Так бывает за некоторыми роутерами. Попробуйте Tailscale или ZeroTier.',nick)},25000);
  },
  fail(msg,peer){
    const p=peer||F.peer;F.state='idle';F.peer=null;
    if(p)this.drop(p,true);
    this.ui();if(F.ui)F.ui.err(msg);
  },
  drop(peer,quiet){
    let e=this.pcs[peer];
    if(!e){peer=Object.keys(this.pcs).find(k=>this.pcs[k].label===peer);e=this.pcs[peer]}
    if(!e)return;
    const who=e.label||peer;
    clearTimeout(e.t);delete this.pcs[peer];
    try{if(e.dc)e.dc.close();e.pc.close()}catch(err){}
    NETB.peerClose(peer).catch(()=>{});
    if(!quiet&&F.peer===who&&F.state==='joined'){F.state='idle';F.peer=null;this.ui();toast('«'+who+'» отключился')}
  },
  closePeers(){Object.keys(this.pcs).forEach(p=>this.drop(p,true))},
  /* --- без сервера: друзья обмениваются двумя кодами --- */
  codePc(role,offerer,label){
    const peer='code'+(++this.n),e=this.mkPc(peer,role,offerer);
    e.label=label;e.code=true;
    e.t=setTimeout(()=>{if(F.state!=='joined')this.fail('Не удалось соединиться. Проверьте, что оба вставили коды целиком, и попробуйте ещё раз.',peer)},120000);
    return {e,peer};
  },
  async gathered(pc){
    if(pc.iceGatheringState==='complete')return;
    await new Promise(res=>{
      const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);res()}};
      pc.addEventListener('icegatheringstatechange',f);setTimeout(res,6000);
    });
  },
  async codeHost(){
    if(this.codePeer)this.drop(this.codePeer,true);
    await NETB.hostStart();
    const {e,peer}=this.codePc('host',true,'Друг');this.codePeer=peer;
    const off=await e.pc.createOffer();await e.pc.setLocalDescription(off);await this.gathered(e.pc);
    const d=e.pc.localDescription;
    return packCode({t:'offer',d:{type:d.type,sdp:d.sdp},b:(BUILDS[0]||{}).name||''});
  },
  async codeAccept(code){

function poses(t){
  const me=Z(),pe=Z();let sM='',sP='',notes=false;
  if(F.state==='joined'){
    const k=t-F.pop;
    if(k<2600){
      const j=Math.abs(Math.sin(k/170))*5*(k<2200?1:(2600-k)/400);
      [me,pe].forEach(p=>{p.dy=-j;p.aA=2.7+Math.sin(k/90)*.3;p.aB=-(2.7+Math.cos(k/90)*.3);p.lA=Math.sin(k/170)*.25;p.lB=-p.lA});
      if(k>300)sM='Ура!';if(k>900)sP='Ты пришёл!';
    }else{
      const q=k-2600,act=Math.floor(q/4500)%3,n=Math.floor(q/2200),w=Math.sin(t/190);
      if(act===0){
        const L=['Привет!','Го играть!','Я готов','Берём кирки?','Круто!','Построим дом?'];
        me.aB=-(.5+Math.sin(t/260)*.35);pe.aA=.5+Math.sin(t/260+1.5)*.35;
        me.a=Math.sin(t/400)*.06;pe.a=Math.sin(t/400+1)*.06;
        if(n%2===0)sM=L[n%L.length];else sP=L[n%L.length];
      }else if(act===1){
        [me,pe].forEach(p=>{p.dy=-Math.abs(w)*2;p.lA=w*.5;p.lB=-w*.5;p.a=w*.12});
        me.aA=1.1+w*.9;me.aB=-(1.1-w*.9);pe.aA=1.1-w*.9;pe.aB=-(1.1+w*.9);notes=true;
        if(n%2===0)sM='Танцуем!';else sP='Ещё!';
      }else{
        const sw=1.3+Math.sin(t/230)*1.1;
        me.aB=-sw;me.iB='pick';pe.aA=sw;pe.iA='pick';
        if(n%2===0)sM='Копаем!';else sP='Алмазы!';
      }
    }
  }else if(F.state==='search'){
    me.aA=.35;me.aB=-.35;sM='Я готов!';
  }else{
    me.a=.1;me.hy=1;me.aA=.05;me.aB=-(.75+Math.sin(t/520)*.2);me.iB='stick';

}

function down(img,w,h){
  let c=img,cw=img.width,ch=img.height;
  while(cw/2>w){cw=Math.ceil(cw/2);ch=Math.ceil(ch/2);const t=document.createElement('canvas');t.width=cw;t.height=ch;const g=t.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(c,0,0,cw,ch);c=t}
  const f=document.createElement('canvas');f.width=w;f.height=h;const g=f.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(c,0,0,w,h);return f;
}

const EMB={ps:[],raf:0,cv:null,ctx:null};
function emSize(){const c=EMB.cv;c.width=Math.max(60,Math.ceil(c.clientWidth/3));c.height=Math.max(60,Math.ceil(c.clientHeight/3))}
function emDraw(t){
  const c=EMB.cv,x=EMB.ctx;
  x.clearRect(0,0,c.width,c.height);
  const g=x.createRadialGradient(c.width/2,c.height+10,0,c.width/2,c.height+10,c.height*.85);
  g.addColorStop(0,'rgba(255,120,30,.20)');g.addColorStop(1,'rgba(255,120,30,0)');
  x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
  if(!EMB.ps.length)for(let i=0;i<34;i++)EMB.ps.push({x:Math.random()*c.width,y:Math.random()*c.height,v:.12+Math.random()*.3,s:Math.random()<.2?2:1,p:Math.random()*6});
  EMB.ps.forEach((p,i)=>{
    if(EMB.raf){p.y-=p.v;p.x+=Math.sin(t/900+p.p)*.12;if(p.y<-3){p.y=c.height+2;p.x=Math.random()*c.width}}
    const a=Math.max(0,Math.min(1,p.y/c.height*1.4));
    x.globalAlpha=.25+.55*a*(.6+.4*Math.sin(t/300+p.p));x.fillStyle=i%3?'#ff9a2e':'#ffe066';x.fillRect(p.x|0,p.y|0,p.s,p.s);
  });
  x.globalAlpha=1;
}
function emStart(){
  if(EMB.raf){cancelAnimationFrame(EMB.raf);EMB.raf=0}
  if(!EMB.cv){EMB.cv=document.getElementById('embers');EMB.ctx=EMB.cv.getContext('2d');EMB.ctx.imageSmoothingEnabled=false;emSize();window.addEventListener('resize',()=>{emSize();emDraw(performance.now())})}
  emDraw(performance.now());
  if(!CFG.anim||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  let last=0;const loop=t=>{EMB.raf=requestAnimationFrame(loop);if(t-last<80)return;last=t;emDraw(t)};
  EMB.raf=requestAnimationFrame(loop);
}

  const row=$('div','row'),last=i===TOUR.length-1;
  if(s.act)row.appendChild(btn('tab sm',s.act[0],s.act[1]));
  if(i>0)row.appendChild(btn('tab sm','Назад',()=>tourShow(i-1)));
  row.appendChild(last?btn('tab sm ok','Начать',()=>endTour(true)):btn('tab sm ok','Далее',()=>tourShow(i+1)));
  if(!last)row.appendChild(btn('tab sm','Пропустить',()=>endTour(true)));
  tip.append($('div','tt-n',(i+1)+' из '+TOUR.length),$('b',null,s.t),$('p',null,s.x),row);
  setTimeout(tourPlace,80);
}
function tourPlace(){
  if(!TS.w)return;
  const s=tourStep(TS.i),tip=TS.tip,hole=TS.hole,el=s.sel&&document.querySelector(s.sel),vw=window.innerWidth,vh=window.innerHeight;
  if(!el){
    hole.style.display='none';TS.w.classList.add('solid');
    tip.style.left=Math.max(12,(vw-tip.offsetWidth)/2)+'px';tip.style.top=Math.max(12,(vh-tip.offsetHeight)/2)+'px';return;
  }
  TS.w.classList.remove('solid');hole.style.display='block';
  el.scrollIntoView({block:'nearest'});
  const r=el.getBoundingClientRect(),p=8,tw=tip.offsetWidth,th=tip.offsetHeight;
  Object.assign(hole.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+2*p+'px',height:r.height+2*p+'px'});
  let x,y;
  if(r.right+tw+32<vw){x=r.right+p+16;y=r.top}
  else if(r.bottom+th+32<vh){x=r.left;y=r.bottom+p+16}
  else if(r.top-th-32>0){x=r.left;y=r.top-th-p-16}
  else{x=(vw-tw)/2;y=vh-th-16}
  tip.style.left=Math.max(12,Math.min(vw-tw-12,x))+'px';tip.style.top=Math.max(12,Math.min(vh-th-12,y))+'px';
}

/* ---- фоновая музыка: оригинальные генеративные треки + свои файлы ---- */
let musicOn=true,mAudio=null,genTimer=null,bus=null,bn=null,tr=0,cnt=0,cur=0;
try{musicOn=localStorage.getItem('mus')!=='0'}catch(e){}
function getAc(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
const TRACKS=[
  {n:'Рассвет',f:[261.63,293.66,329.63,392,440,523.25,587.33,659.25],type:'triangle',gap:[2200,5400],dec:3.2,vol:.12,wet:[.45,.45,1800],low:.2,pair:.35},
  {n:'Пещеры',f:[110,130.81,146.83,164.81,196,220,261.63],type:'sine',gap:[4000,8000],dec:5.5,vol:.16,wet:[.6,.58,1100],low:.35,pair:.2},
  {n:'Дождь',f:[349.23,392,440,523.25,587.33,698.46,783.99],type:'triangle',gap:[1300,3200],dec:2.4,vol:.1,wet:[.3,.5,2400],low:.1,pair:.5},
  {n:'Ночной лес',f:[164.81,196,220,246.94,329.63,392,493.88],type:'sine',gap:[2600,6200],dec:4.2,vol:.14,wet:[.5,.5,1500],low:.3,pair:.3},
  {n:'Деревня',f:[293.66,329.63,369.99,440,493.88,587.33,659.25],type:'triangle',gap:[1800,4200],dec:2.8,vol:.11,wet:[.38,.4,2200],low:.15,pair:.6},
  {n:'Закат',f:[196,220,246.94,293.66,392,440,493.88,587.33],type:'sine',gap:[2800,5600],dec:4.6,vol:.13,wet:[.55,.52,1700],low:.25,pair:.4}
];
const GEN=TRACKS.map((t,i)=>({n:t.n,g:i})),LIST=[...GEN];
function getBus(){
  if(bus)return bus;
  const a=getAc(),inp=a.createGain(),d=a.createDelay(1),fb=a.createGain(),lp=a.createBiquadFilter(),w=TRACKS[tr].wet;
  d.delayTime.value=w[0];fb.gain.value=w[1];lp.frequency.value=w[2];lp.type='lowpass';
  inp.connect(a.destination);inp.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(a.destination);
  bn={d,fb,lp};return bus=inp;
}
function applyWet(){
  if(!bn)return;
  const w=TRACKS[tr].wet,t=ac.currentTime;
  bn.d.delayTime.setTargetAtTime(w[0],t,.1);bn.fb.gain.setTargetAtTime(w[1],t,.1);bn.lp.frequency.setTargetAtTime(w[2],t,.1);
}
function note(){
  if(!musicOn||mAudio||VOL.m<=0)return;
  try{
    const a=getAc(),b=getBus(),T=TRACKS[tr],t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type=T.type;o.frequency.value=T.f[(Math.random()*T.f.length)|0]*(Math.random()<T.low?.5:1);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(T.vol*VOL.m,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+T.dec);
    o.connect(g).connect(b);o.start(t);o.stop(t+T.dec+.1);
  }catch(e){console.error(e)}
}
function genLoop(){
  clearTimeout(genTimer);
  const T=TRACKS[tr];
  genTimer=setTimeout(()=>{
    note();if(Math.random()<T.pair)setTimeout(note,350);
    if(++cnt>=45){playTrack(cur+1);return}
    genLoop();
  },T.gap[0]+Math.random()*(T.gap[1]-T.gap[0]));
}
function playTrack(i){
  clearTimeout(genTimer);if(mAudio){mAudio.pause();mAudio=null}
  cur=((i%LIST.length)+LIST.length)%LIST.length;
  const T=LIST[cur];paintTrack();
  if(!musicOn)return;
  if(T.url){mAudio=new Audio(T.url);mAudio.volume=.4*VOL.m;mAudio.addEventListener('ended',()=>playTrack(cur+1));mAudio.play().catch(()=>{})}
  else{tr=T.g;cnt=0;applyWet();note();genLoop()}
}
function musicStart(){if(musicOn)playTrack(cur)}
function musicStop(){clearTimeout(genTimer);if(mAudio)mAudio.pause()}

/* ---- кнопки звука и музыки ---- */
const snd=document.getElementById('snd');
snd.appendChild(icon('sound'));
const sl=document.createElement('span');sl.className='lbl';snd.appendChild(sl);
function paintSnd(){sl.textContent='Звук: '+(soundOn?'вкл':'выкл');snd.setAttribute('aria-pressed',String(soundOn))}
snd.addEventListener('click',()=>{
  soundOn=!soundOn;
  try{localStorage.setItem('snd',soundOn?'1':'0')}catch(e){}
  paintSnd();sClick();
});
paintSnd();
const mus=document.getElementById('mus'),own=document.getElementById('own'),file=document.getElementById('file'),nxt=document.getElementById('nxt');
mus.appendChild(icon('music'));own.appendChild(icon('disc'));nxt.appendChild(icon('play'));
const ml=document.createElement('span'),ol=document.createElement('span'),nl=document.createElement('span');
[ml,ol,nl].forEach(x=>x.className='lbl');
mus.appendChild(ml);own.appendChild(ol);nxt.appendChild(nl);ol.textContent='Свои треки';
function paintMus(){ml.textContent='Музыка: '+(musicOn?'вкл':'выкл');mus.setAttribute('aria-pressed',String(musicOn))}
function paintTrack(){const n=LIST[cur].n;nl.textContent='Трек: '+(n.length>14?n.slice(0,12)+'…':n)}
mus.addEventListener('click',()=>{
  musicOn=!musicOn;
  try{localStorage.setItem('mus',musicOn?'1':'0')}catch(e){}
  paintMus();sClick();musicOn?musicStart():musicStop();
});
nxt.addEventListener('click',()=>{sClick();playTrack(cur+1)});
own.addEventListener('click',()=>file.click());
file.addEventListener('change',()=>{
  const fs=[...file.files];if(!fs.length)return;
  const first=LIST.length;
  fs.forEach(f=>LIST.push({n:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));
  ol.textContent='Свои треки: '+(LIST.length-GEN.length);
  playTrack(first);
});
[snd,mus,own,nxt].forEach(b=>b.addEventListener('mouseenter',sHover));
paintTrack();paintMus();
document.addEventListener('pointerdown',musicStart,{once:true});

document.getElementById('logo').src=ICON;
{const l=document.createElement('link');l.rel='icon';l.href=ICON;document.head.appendChild(l)}
document.body.classList.toggle('calm',!CFG.anim);
select('play',false);
emStart();
{const ac2=document.getElementById('acct');ac2.addEventListener('mouseenter',sHover);ac2.addEventListener('click',()=>{sClick();select('settings',false)})}
paintChip();
if(BR&&BR.restore)BR.restore().then(r=>{if(r&&r.ok)applyAuth(r);else if(CFG.ms){CFG.ms=null;saveCfg();paintChip()}}).catch(()=>{});
if(!CFG.tour)setTimeout(startTour,700);
</script>
